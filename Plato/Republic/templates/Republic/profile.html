{% load static %}


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profile</title>
    <base href="/">
    <link rel="stylesheet" href="{% static 'Republic/main.css' %}">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
     <header>
        <a href="">Movies</a> 
        <a href="genres/">Genres</a>
        <a href="profile">Profile</a>
    </header>
    <div class="responsive-form">
        <form id="myForm">
            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname" placeholder="Your first name" required>
            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname" placeholder="Your last name" required>
            <label for="Email">Email (optional):</label>
            <input type="email" id="Email" name="Email" placeholder="youremail@gmail.com">
            <label for="Phone">Phone:</label>
            <input type="tel" id="Phone" name="Phone" pattern="^\+?[1-9]\d{1,14}$" placeholder="+79323249023" required>
            <input type="submit" value="Register">
        </form>
    </div>


</body>
</html>

<style scoped>

.responsive-form {
    margin-top: 200px;
    max-width: 600px;
    width: 100%;
    border-radius: 4px;
    border: 2px solid #3A3A3A;
    background-color:  #3A3A3A;
    padding: 20px;
}

form {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
}

label {
  min-width: 48%;
  margin-bottom: 10px;
  font-family: "Open Sans", sans-serif;
  font-weight: 600;
  color: white;
}


input[type="text"], 
input[type="email"], 
input[type="tel"], 
textarea {
    background-color: black;
    color: white;
}

input[type=text], select {
  min-width: 45%;
  margin-bottom: 10px;
  border: 1px solid #ccc;
  border-radius: 4px;
  padding: 10px;

}

input[type=email], select {
  min-width: 45%;
  margin-bottom: 10px;
  border: 1px solid #ccc;
  border-radius: 4px;
  padding: 10px;
}

input[type=tel], select {
  min-width: 45%;
  margin-bottom: 10px;
  border: 1px solid #ccc;
  border-radius: 4px;
  padding: 10px;
}



input[type=submit] {
  width: 100%;
  background-color: black;
  color: white;
  padding: 14px;
  margin: 8px 0;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-family: "Inter", sans-serif;
  font-size: large;
}



</style>


<script>
document.getElementById('myForm').addEventListener('submit', function(event) {
    event.preventDefault();

    const firstName = document.getElementById('fname').value;

    alert(`Thank you, ${firstName}! You have successfully registered.`);

    this.reset();
});
</script>
